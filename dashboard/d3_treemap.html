<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>__D3__</script>
  <style>
    * {box-sizing:border-box}
    body {margin:0;background:#fff;color:#20364f;font:14px/1.35 system-ui,Arial,sans-serif}
    #basis {margin:0 0 8px;color:#465b71;font-size:12px}
    #chart {width:100%;height:310px;position:relative}
    .node {position:absolute;border:2px solid #fff;border-radius:6px;padding:8px;
      overflow:hidden;line-height:1.2;color:#fff;font-weight:700;cursor:pointer;
      transition:filter .15s ease,opacity .15s ease}
    .node:hover,.node:focus-visible,.node.selected {filter:brightness(1.13);z-index:2;
      outline:3px solid #152c44;outline-offset:-3px}
    .node.muted {opacity:.45}
    .node .name {display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .node small {display:block;font-size:12px;font-weight:500;margin-top:4px}
    #detail {min-height:43px;margin:7px 0;padding:8px 10px;border-radius:7px;
      background:#e9f4f5;color:#183e4c}
    #detail strong {color:#142d44}
    #all-label {font-size:12px;font-weight:700;color:#344b64;margin:7px 0 3px}
    #all {height:155px;overflow-y:auto;border:1px solid #dce5ed;border-radius:7px}
    .row {width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;
      padding:6px 9px;background:#fff;border:0;border-bottom:1px solid #edf1f5;
      color:#20364f;text-align:left;font:inherit;cursor:pointer}
    .row:hover,.row:focus-visible,.row.selected {background:#e9f4f5;outline:2px solid #167b87;outline-offset:-2px}
    .row span:first-child {overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .row .value {font-variant-numeric:tabular-nums}
    #tooltip {display:none;position:fixed;z-index:10;max-width:240px;background:#172b45;color:#fff;
      border-radius:8px;padding:9px 12px;pointer-events:none;box-shadow:0 6px 20px #223a5540}
    @media (max-width:520px) {
      #chart {height:280px}
      .node {padding:5px;font-size:11px}
      .node small {font-size:10px}
      .row {gap:8px;font-size:12px}
    }
  </style>
</head>
<body>
<p id="basis"></p>
<div id="chart" role="group" aria-label="Mapa interactivo de géneros por cantidad de títulos"></div>
<div id="detail" aria-live="polite">Selecciona un bloque o una fila para ver sus datos.</div>
<div id="all-label">Todos los géneros, incluidos los de menor área</div>
<div id="all" role="group" aria-label="Lista de todos los géneros"></div>
<div id="tooltip" role="tooltip"></div>
<script>
const payload = __DATA__;
const records = payload.records.filter(item => Number.isFinite(item.value) && item.value > 0);
const selectedTitles = payload.selectedTitles;
const chart = document.getElementById("chart");
const detail = document.getElementById("detail");
const list = document.getElementById("all");
const tooltip = document.getElementById("tooltip");
const formatCount = value => value.toLocaleString("es-CL");
const formatPercent = value => new Intl.NumberFormat("es-CL", {maximumFractionDigits:2}).format(value);
const percent = value => selectedTitles ? 100 * value / selectedTitles : 0;
const colors = ["#245e9c", "#116d70", "#554c97", "#216c5d", "#864f69", "#80551c"];
document.getElementById("basis").textContent =
  `Base: ${formatCount(selectedTitles)} títulos seleccionados. Porcentaje = títulos del género / esta base. Un título puede pertenecer a varios géneros; los porcentajes no suman 100 %.`;
let activeName = null;

function description(item) {
  return `${item.name}: ${formatCount(item.value)} títulos · ${formatPercent(percent(item.value))} % de los títulos seleccionados`;
}

function setActive(item) {
  activeName = item.name;
  detail.replaceChildren();
  const strong = document.createElement("strong");
  strong.textContent = item.name;
  detail.append(strong, document.createTextNode(` · ${formatCount(item.value)} títulos · ${formatPercent(percent(item.value))} % de la selección`));
  document.querySelectorAll(".node,.row").forEach(element => {
    const chosen = element.dataset.name === activeName;
    element.classList.toggle("selected", chosen);
    if (element.classList.contains("node")) element.classList.toggle("muted", !chosen);
  });
}

function showTooltip(event, item) {
  tooltip.textContent = description(item);
  tooltip.style.display = "block";
  const left = Math.min(event.clientX + 12, window.innerWidth - tooltip.offsetWidth - 8);
  const top = Math.min(event.clientY + 12, window.innerHeight - tooltip.offsetHeight - 8);
  tooltip.style.left = Math.max(8, left) + "px";
  tooltip.style.top = Math.max(8, top) + "px";
}

function draw() {
  chart.replaceChildren();
  if (!records.length) {
    detail.textContent = "No hay géneros informados para esta selección.";
    return;
  }
  const root = d3.hierarchy({name:"Géneros", children:records})
    .sum(item => item.value || 0).sort((a,b) => b.value - a.value);
  d3.treemap().size([chart.clientWidth, chart.clientHeight]).paddingInner(3)(root);
  root.leaves().forEach((node, index) => {
    const item = node.data;
    const width = node.x1 - node.x0, height = node.y1 - node.y0;
    const box = document.createElement("div");
    box.className = "node";
    box.dataset.name = item.name;
    box.setAttribute("role", "button");
    box.tabIndex = 0;
    box.setAttribute("aria-label", description(item));
    box.style.left = node.x0 + "px";
    box.style.top = node.y0 + "px";
    box.style.width = width + "px";
    box.style.height = height + "px";
    box.style.background = colors[index % colors.length];
    if (width > 82 && height > 32) {
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = item.name;
      box.append(name);
      if (height > 52) {
        const count = document.createElement("small");
        count.textContent = `${formatCount(item.value)} · ${formatPercent(percent(item.value))} %`;
        box.append(count);
      }
    }
    box.addEventListener("click", () => setActive(item));
    box.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {event.preventDefault(); setActive(item);}
    });
    box.addEventListener("pointermove", event => showTooltip(event, item));
    box.addEventListener("pointerleave", () => tooltip.style.display = "none");
    chart.append(box);
  });
  if (activeName) {
    const item = records.find(record => record.name === activeName);
    if (item) setActive(item);
  }
}

records.forEach(item => {
  const row = document.createElement("button");
  row.type = "button";
  row.className = "row";
  row.dataset.name = item.name;
  row.setAttribute("aria-label", description(item));
  [item.name, formatCount(item.value), `${formatPercent(percent(item.value))} %`].forEach(value => {
    const cell = document.createElement("span");
    cell.textContent = value;
    if (value !== item.name) cell.className = "value";
    row.append(cell);
  });
  row.addEventListener("click", () => setActive(item));
  list.append(row);
});
new ResizeObserver(draw).observe(chart);
draw();
</script>
</body>
</html>
